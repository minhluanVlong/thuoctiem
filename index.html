<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sổ Thuốc Tiêm – Khoa Nội Tổng Hợp Nhi Truyền Nhiễm</title>
    <meta name="description" content="Ứng dụng xử lý file Excel thống kê thuốc tiêm, tự động phân loại Khu Nội Nhi và Khu Nhiễm, tổng hợp sổ thuốc tiêm và biểu mẫu in ấn phục vụ điều dưỡng." />
    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return currentFetch;
            },
            set: function (fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

  </head>

</html>
